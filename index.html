.sqi-wb-sidebar{background:#123b2e;padding:25px 15px;color:#d7eee0;display:flex;flex-direction:column;gap:6px}

.sqi-wb-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:22px}
.sqi-wb-metric{border:1px solid #e5ebe4;border-radius:6px;padding:13px 10px;min-width:0;background:#fff}

.sqi-wb-row{display:grid;grid-template-columns:1.12fr .83fr .55fr;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eef0eb;font-size:10px;color:#566d5a}

function renderAccess(){let mode=state.screen;const isLogin=mode==='login';const isRegister=mode==='register';const title=isLogin?'Dobrodo&#353;li natrag.':isRegister?'Otvorite svoj ra&#269;un.':'Ponovno do svog profila.';return `<div class="access-layout page-fade"><aside class="access-left"><div class="access-left-image"></div><div class="access-brand"><a href="#" data-screen="landing">${logo(true,true)}</a></div><div class="access-copy"><div class="eyebrow">SCONTIQ / SMARTER FLOWS</div><h2>Kapital se kre&#263;e.<br><span>Povjerenje ostaje.</span></h2><p>Jedan prostor za pouzdaniji pregled potra&#382;ivanja, suradnji, potpisa i naplate.</p></div><div class="access-left-bottom"><span>POVEZUJE / OPTIMIZIRA / STVARA VRIJEDNOST</span><span>KONCEPT 2026</span></div></aside><div class="access-right"><div class="access-top"><button class="back-home" data-screen="landing">${elIcon('arrow','icon-sm')} Natrag na web</button></div><div class="access-body"><div class="eyebrow" style="color:#3b835e">${isLogin?'DEMO PRISTUP':isRegister?'REGISTRACIJA':'OBNOVA PRISTUPA'}</div><h1>${title}</h1><p class="subcopy">${isLogin?'Ovo je interaktivni prototip. Nemojte unositi stvarne lozinke ili povjerljive podatke. Demo profile možete otvoriti bez prijave.':isRegister?'Jednostavan po&#269;etak. Identitet i tvrtka provjeravaju se prije kori&#353;tenja financijskih funkcija.':'Unesite svoju e-mail adresu. U stvarnoj platformi dobit &#263;ete upute za obnovu pristupa.'}</p>${isLogin?renderLoginBody():isRegister?renderRegisterBody():renderForgotBody()}</div><div class="access-bottom">ScontIQ / Interaktivni dizajn-koncept</div></div></div>`}
function renderLoginBody(){return `<form data-form="login"><div class="field"><label for="login-email">E-mail adresa</label><input id="login-email" name="email" autocomplete="email" type="email" placeholder="ime@tvrtka.hr" required></div><div class="field"><label for="login-password">Lozinka</label><div class="input-wrap"><input id="login-password" name="password" autocomplete="current-password" type="password" placeholder="Samo izmišljeni podaci" required><button type="button" data-action="toggle-password" aria-label="Prika&#382;i ili sakrij lozinku">${elIcon('eye')}</button></div></div><div class="form-row"><label class="check-wrap"><input type="checkbox" checked> Zapamti moj ure&#273;aj</label><a href="#" class="quiet-link" data-screen="forgot">Zaboravili ste lozinku?</a></div><button class="btn btn-primary full" type="submit" style="height:49px">Prijavi se ${elIcon('arrow')}</button></form><div style="font-size:12px;text-align:center;margin-top:19px;color:#829486">Nemate profil? <a href="#" class="quiet-link" data-screen="register">Registrirajte se</a></div><div class="access-divider">ILI ISTRA&#381;ITE INTERAKTIVNI DEMO</div><div class="demo-roles">${[['klijent','Klijent'],['partner','Partner'],['sudionik','Sudionik'],['investitor','Investitor'],['admin','Administrator'],['operator','Operator']].map(r=>`<button type="button" class="demo-role" data-role="${r[0]}">${r[1]} ${elIcon('arrow','icon-sm')}</button>`).join('')}</div><p class="demo-note">Demo profili otvaraju se bez stvarne autentifikacije. Nijedan prikazani podatak ne predstavlja stvarnu ponudu ili transakciju.</p>`}
function renderRegisterBody(){let step=state.registerStep;let dots=`<div class="progress-dots">${[1,2,3].map((s,i)=>`${i?'<span class="progress-line"></span>':''}<span class="progress-dot ${s===step?'current':s<step?'done':''}">${s<step?elIcon('check','icon-sm'):s}</span>`).join('')}</div>`;let c='';if(step===1){c=`<div class="field"><label>E-mail adresa</label><input type="email" name="email" data-register-field="email" value="${state.registration.email||''}" placeholder="ime@tvrtka.hr"></div><div class="field"><label>Lozinka</label><input type="password" name="password" data-register-field="password" placeholder="Najmanje 12 znakova"></div><p class="app-note">Preporu&#269;ujemo jedinstvenu lozinku i dodatnu autentifikaciju.</p>`}else if(step===2){c=`<div class="field"><label>Naziv tvrtke / OPG-a</label><input type="text" data-register-field="company" value="${state.registration.company||''}" placeholder="Naziv poslovnog subjekta"></div><div class="field"><label>OIB tvrtke</label><input inputmode="numeric" data-register-field="oib" value="${state.registration.oib||''}" placeholder="11 znamenki" maxlength="11"></div><div class="field"><label>Uloga u poslovnom odnosu</label><select data-register-field="regrole"><option value="Klijent">Klijent</option><option value="Partner">Partner</option><option value="Sudionik">Sudionik u kompenzaciji</option></select></div>`}else{c=`<div class="noticebar">${elIcon('shield')} Preostali koraci u stvarnom sustavu: potvrda e-maila, identiteta i ovlasti te pregled potrebnih ugovora.</div><label class="check-wrap" style="align-items:start;line-height:1.7"><input type="checkbox" id="register-consent"> Potvr&#273;ujem da razumijem kako je ovo dizajn-prototip, bez kreiranja stvarnog korisni&#269;kog ra&#269;una.</label>`}return `${dots}${c}<div style="display:flex;gap:10px;margin-top:23px">${step>1?'<button class="btn btn-outline" data-action="register-back" style="flex:1">Natrag</button>':''}<button class="btn btn-primary" data-action="register-next" style="flex:2">${step===3?'Zavr&#353;i demo':'Nastavi'} ${elIcon('arrow')}</button></div><p class="demo-note" style="margin-top:20px">Ve&#263; imate profil? <a href="#" class="quiet-link" data-screen="login">Prijavite se</a></p>`}
function renderForgotBody(){return `<form data-form="forgot"><div class="field"><label for="forgot-email">E-mail adresa</label><input id="forgot-email" type="email" placeholder="ime@tvrtka.hr" required></div><button class="btn btn-primary full" type="submit">Zatra&#382;i poveznicu ${elIcon('arrow')}</button></form><div style="margin-top:25px"><button class="back-home" data-screen="login">${elIcon('chevron')} Natrag na prijavu</button></div>`}
